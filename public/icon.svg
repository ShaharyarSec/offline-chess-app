<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.3"/>
  <!-- Chess Knight Logo -->
  <g filter="url(#shadow)" fill="url(#gold)" transform="translate(64, 48) scale(0.75)">
    <path d="M 256 70 C 220 70 180 90 160 130 C 150 150 148 180 148 195 C 130 190 110 200 100 220 C 90 240 95 265 110 280 C 120 290 140 295 155 290 C 150 310 140 330 130 350 C 120 370 100 395 100 395 L 412 395 C 412 395 400 350 380 300 C 370 270 370 230 370 200 C 370 130 320 70 256 70 Z" />
    <path d="M 120 410 L 392 410 C 400 410 408 418 408 428 C 408 438 400 446 392 446 L 120 446 C 112 446 104 438 104 428 C 104 418 112 410 120 410 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Mane details -->
    <path d="M 230 140 Q 280 150 290 200" stroke="#0f172a" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 210 180 Q 270 200 280 260" stroke="#0f172a" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Eye -->
    <circle cx="185" cy="180" r="14" fill="#0f172a"/>
    <circle cx="188" cy="177" r="4" fill="#fef08a"/>
    <!-- Muzzle / nostril -->
    <ellipse cx="125" cy="240" rx="6" ry="10" fill="#0f172a" transform="rotate(-15 125 240)"/>
  </g>
</svg>
